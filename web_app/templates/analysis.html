<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
    <style>
        /* Background Configuration */
        body {
            /* Loads image from the 'static' folder */
            background-image: url("{{ url_for('static', filename='Screenshot 2026-04-14 155253.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphism Container to keep text readable */
        .analysis-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 10px;
        }

        .data-section {
            margin-top: 20px;
            text-align: left;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="analysis-container">
        <h1>Detailed Analysis</h1>
        
        <div class="data-section">
            <p><strong>Status:</strong> Analysis Complete</p>
            <p>Below are the results processed from your input. The colorful background adds a creative touch to your workspace!</p>
            
            <div style="background: #f9f9f9; padding: 15px; border-left: 5px solid #3498db;">
                {{ analysis_content }}
            </div>
        </div>

        <a href="{{ url_for('index') }}" class="btn-back">Return to Home</a>
    </div>

</body>
</html>
